name: tick

# The heartbeat. Hourly at minute 7, plus 03:55 UTC so the morning brief lands at 08:00 Dubai.
# Authenticates with a GitHub OIDC token that the Tower verifies. No secrets to configure.
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "55 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TOWER_URL: https://the-tower-saxqb777s-projects.vercel.app

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint an OIDC token for this run
        id: oidc
        run: |
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=the-tower" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Call the heartbeat
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          URL: ${{ secrets.TOWER_URL || env.TOWER_URL }}
        run: |
          code=$(curl -sS -o /tmp/tick.json -w "%{http_code}" --max-time 330 -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" -H "x-tower-auth: github-oidc" \
            "${URL%/}/api/tick?trigger=cron")
          cat /tmp/tick.json; echo
          test "$code" = "200"
