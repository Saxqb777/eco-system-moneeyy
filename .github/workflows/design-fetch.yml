name: design-fetch

# Downloads concept images listed in design/concepts/manifest.json into the repo.
# Exists because the build sandbox cannot reach the image host. Commits back to the same branch.
on:
  push:
    paths: ["design/concepts/manifest.json"]
    branches-ignore: ["main"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch images from the manifest
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib
          m = json.load(open("design/concepts/manifest.json"))
          for img in m["images"]:
              dest = pathlib.Path("design/concepts") / img["file"]
              if dest.exists() and dest.stat().st_size > 1000:
                  print("have", dest); continue
              urllib.request.urlretrieve(img["url"], dest)
              print("fetched", dest, dest.stat().st_size, "bytes")
          PY
      - name: Commit the images
        run: |
          git config user.name "tower-design-fetch"
          git config user.email "noreply@github.com"
          git add design/concepts/*.png
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "design: fetch concept images listed in the manifest"
          git push
